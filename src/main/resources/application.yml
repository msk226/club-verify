spring:
  application:
    name: club-verify

  datasource:
    url: jdbc:mysql://localhost:3306/club_verify?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:club_verify;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: prod

# External API Configuration
external:
  google:
    search:
      api-key: ${GOOGLE_API_KEY:}
      cx: ${GOOGLE_CX:}
      base-url: https://www.googleapis.com/customsearch/v1
      timeout: 10000

  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: https://generativelanguage.googleapis.com/v1beta
    model: gemini-2.5-flash-lite
    timeout: 60000

  slack:
    webhook-url: ${SLACK_WEBHOOK_URL:}
    timeout: 5000

# Resilience4j Configuration
resilience4j:
  retry:
    instances:
      searchApi:
        max-attempts: 3
        wait-duration: 1s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
      llmApi:
        max-attempts: 2
        wait-duration: 2s
        exponential-backoff-multiplier: 2

  circuitbreaker:
    instances:
      searchApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
      llmApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2

# Async Configuration
async:
  core-pool-size: 4
  max-pool-size: 10
  queue-capacity: 100

# Logging
logging:
  level:
    hanyang.erica: DEBUG
    org.springframework.web.reactive: DEBUG
